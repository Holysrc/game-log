<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23f9e7ae'/%3E%3Cstop offset='.5' stop-color='%23e9c46a'/%3E%3Cstop offset='1' stop-color='%23b07b1e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M22 15h20c8.5 0 15.2 5.4 17.2 13l3.2 12c1.7 6.5-3 13-9.4 13-3.8 0-7-1.9-9-5l-3.6-5.5H23.6L20 48c-2 3.1-5.2 5-9 5-6.4 0-11.1-6.5-9.4-13l3.2-12C6.8 20.4 13.5 15 22 15z'/%3E%3C/svg%3E">
<title>Журнал игр</title>
<style>
  :root{
    --bg:#0b1120;
    --win-top:#2b3f8c;
    --win-mid:#182566;
    --win-bot:#0d1544;
    --border:#c9d3ee;
    --border-dim:#5a6aa8;
    --text:#eef2ff;
    --text-dim:#9aa8d4;
    --gold:#e9c46a;
    --green:#8fd99a;
    --blue:#8fa3d9;
    --gray:#8a8f9c;
    --danger:#e07a7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;}
  body{padding:14px 12px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}

  /* ---- FF-window ---- */
  .win{
    background:linear-gradient(180deg,var(--win-top) 0%,var(--win-mid) 48%,var(--win-bot) 100%);
    border:2px solid var(--border);
    border-radius:8px;
    box-shadow:inset 0 0 0 1px rgba(10,16,48,.9), inset 0 0 0 2px rgba(255,255,255,.18), 0 3px 10px rgba(0,0,0,.5);
    padding:12px 14px;
  }

  h1{
    font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    font-size:1.35rem;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;
    text-shadow:0 2px 3px rgba(0,0,0,.6);
  }
  .subtitle{color:var(--text-dim);font-size:.78rem;letter-spacing:.05em;margin-top:2px}

  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;text-align:center;background:rgba(6,10,34,.5);border:1px solid var(--border-dim);border-radius:6px;padding:7px 4px}
  .stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}
  .stat span{font-size:.68rem;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase}
  .stat.playing b{color:var(--gold)} .stat.backlog b{color:var(--blue)} .stat.done b{color:var(--green)}
  .fstatus{
    margin-top:9px;font-size:.72rem;color:var(--green);letter-spacing:.04em;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .fstatus::before{content:"⛁ "}
  .fstatus.err{color:var(--gold)}
  .gear{
    position:absolute;top:8px;right:10px;border:none;background:none;cursor:pointer;
    color:var(--text-dim);font-size:1.05rem;padding:4px 6px;
  }
  .gear:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
  .sync{margin-top:12px;display:grid;gap:7px;padding-top:10px;border-top:1px solid rgba(201,211,238,.25)}
  .sync[hidden]{display:none}
  .sync>*{min-width:0}
  .sync .row2{display:flex;gap:7px;flex-wrap:wrap}
  .sync .row2 .btn{flex:1 1 auto;min-width:0}
  .sync input{
    background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:8px 11px;font-size:.88rem;width:100%;
  }
  .sync input:focus{outline:none;border-color:var(--gold)}
  .sync select{
    background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:8px 11px;font-size:.88rem;width:100%;
  }
  .noteinput{
    width:100%;min-height:58px;resize:vertical;
    background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:8px 11px;font-size:.88rem;line-height:1.4;
    font-family:inherit;
  }
  .noteinput:focus{outline:none;border-color:var(--gold)}
  .noteinput::placeholder{color:#6a78ac}
  .sugwrap{position:relative;display:inline-block}
  .sug{position:absolute;top:calc(100% + 4px);left:0;z-index:20;
    background:var(--win-bot);border:1.5px solid var(--border-dim);border-radius:8px;
    padding:5px;display:none;flex-wrap:wrap;gap:4px;max-width:min(260px,72vw);
    box-shadow:0 6px 16px rgba(0,0,0,.55)}
  .sugwrap:focus-within .sug{display:flex}
  .sug:empty{display:none!important}
  .sugbtn{border:1px solid var(--border-dim);border-radius:5px;background:rgba(6,10,34,.7);
    color:var(--text);padding:4px 8px;font-size:.78rem;cursor:pointer}
  .sugbtn:active{border-color:var(--gold);color:var(--gold)}
  .sync .hint{font-size:.72rem;color:var(--text-dim);line-height:1.5}

  /* ---- tabs ---- */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
  .tab{
    flex:0 0 auto;border:1.5px solid var(--border-dim);border-radius:999px;
    background:rgba(10,16,48,.55);color:var(--text-dim);
    padding:6px 12px;font-size:.83rem;cursor:pointer;letter-spacing:.02em;
  }
  .tab.active{border-color:var(--gold);color:var(--gold);background:rgba(233,196,106,.1)}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---- search + add ---- */
  .bar{display:flex;gap:8px;margin-bottom:10px}
  .bar.mainbar{
    position:sticky;top:0;z-index:7;
    background:var(--bg);
    padding:8px 0;margin:0 0 4px;
  }
  .bar input{
    flex:1;background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:9px 12px;font-size:.95rem;
  }
  .bar input::placeholder{color:#6a78ac}
  .searchwrap{position:relative;flex:1;display:flex}
  .searchwrap input{width:100%;padding-right:36px}
  #clearSearch{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    border:none;background:none;color:var(--text-dim);cursor:pointer;
    font-size:1rem;padding:8px 10px;line-height:1;
  }
  #clearSearch:active{color:var(--gold)}
  /* прячем нативный крестик, чтобы не задвоился */
  #search::-webkit-search-cancel-button{display:none}
  .bar input:focus{outline:none;border-color:var(--gold)}
  .btn{
    border:1.5px solid var(--border-dim);border-radius:8px;background:rgba(10,16,48,.6);
    color:var(--text);padding:9px 13px;font-size:.9rem;cursor:pointer;white-space:nowrap;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.gold{border-color:var(--gold);color:var(--gold)}
  .sortrow{margin:-2px 0 10px}
  .sortrow select{
    width:100%;background:rgba(6,10,34,.55);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text-dim);padding:7px 10px;font-size:.82rem;
  }
  .sortrow select:focus{outline:none;border-color:var(--gold)}

  /* ---- list ---- */
  .sec{margin-top:6px}
  .yearhead{
    position:sticky;top:56px;z-index:5;
    background:var(--bg);
    display:flex;align-items:baseline;gap:8px;
    margin:0 0 7px;padding:12px 2px 7px;
    color:var(--text-dim);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;
    cursor:pointer;user-select:none;
  }
  .yearhead:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
  .yearhead .caret{
    color:var(--gold);font-size:.7rem;align-self:center;
    transition:transform .15s;
  }
  .yearhead.col .caret{transform:rotate(-90deg)}
  @media (prefers-reduced-motion:reduce){.yearhead .caret{transition:none}}
  .dice{
    border:1.5px solid var(--gold);border-radius:6px;background:rgba(233,196,106,.08);
    color:var(--gold);cursor:pointer;font-size:.9rem;padding:3px 9px;line-height:1;
    align-self:center;letter-spacing:0;
  }
  .dice:active{transform:translateY(1px)}
  .dice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .dicebar{
    display:block;width:100%;margin:2px 0 10px;text-align:center;
    border:1.5px solid var(--gold);border-radius:8px;background:rgba(233,196,106,.08);
    color:var(--gold);cursor:pointer;padding:11px;font-size:.95rem;letter-spacing:.04em;
  }
  .dicebar:active{transform:translateY(1px)}
  .sersum{
    margin:2px 0 10px;padding:9px 12px;border:1.5px solid var(--blue);border-radius:8px;
    background:rgba(143,163,217,.08);color:var(--text);font-size:.85rem;
  }
  .sersum b{color:var(--blue);letter-spacing:.03em}
  .sersum .n{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gold)}
  @keyframes chosen{
    0%{box-shadow:0 0 0 0 rgba(233,196,106,0)}
    25%{box-shadow:0 0 18px 4px rgba(233,196,106,.75)}
    100%{box-shadow:0 0 0 0 rgba(233,196,106,0)}
  }
  .card.chosen{animation:chosen 1.6s ease-out 2}
  @media (prefers-reduced-motion:reduce){.card.chosen{animation:none;box-shadow:0 0 12px 2px rgba(233,196,106,.6)}}
  .yearhead b{color:var(--text);font-size:1rem;
    font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;letter-spacing:.1em}
  .yearhead .line{flex:1;height:1px;background:var(--border-dim);opacity:.5}
  .yearhead .cnt{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}

  .card{
    position:relative;margin-bottom:7px;padding:10px 12px 10px 26px;cursor:pointer;
    user-select:none;
    content-visibility:auto;contain-intrinsic-size:auto 70px;
  }
  .card.open{content-visibility:visible}
  .card .cursor{
    position:absolute;left:8px;top:12px;color:var(--gold);font-size:.8rem;
    opacity:0;transition:opacity .15s;
  }
  .card.playing .cursor{opacity:1;animation:blink 1.1s steps(2) infinite}
  .card.open .cursor{opacity:1;animation:none}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.card.playing .cursor{animation:none}}

  .card .row{display:flex;align-items:flex-start;gap:8px}
  .card .name{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:.98rem}
  .card .row .badge{margin-left:auto;flex-shrink:0}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .favmark{flex:0 0 auto;color:var(--gold);font-size:.95rem;
    text-shadow:0 1px 3px rgba(0,0,0,.6);align-self:flex-start}
  .card.done .name{color:#d9e2f5}
  .card.dropped .name{color:var(--gray);text-decoration:line-through;text-decoration-color:rgba(138,143,156,.6)}
  .badge{
    flex:0 0 auto;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;
    border:1px solid;border-radius:4px;padding:2px 6px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .badge.done{color:var(--green);border-color:var(--green)}
  .badge.playing{color:var(--gold);border-color:var(--gold)}
  .badge.backlog{color:var(--blue);border-color:var(--blue)}
  .badge.dropped{color:var(--gray);border-color:var(--gray)}
  .plat{
    flex:0 0 auto;font-size:.64rem;letter-spacing:.05em;
    color:var(--text-dim);border:1px dashed var(--border-dim);border-radius:4px;padding:2px 5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;
  }
  .src{
    flex:0 0 auto;font-size:.64rem;letter-spacing:.05em;
    color:var(--green);border:1px solid var(--green);border-radius:4px;padding:2px 5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;opacity:.85;
  }
  .ser{
    flex:0 0 auto;font-size:.64rem;letter-spacing:.05em;cursor:pointer;
    color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:2px 5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;opacity:.9;
  }
  .ser:active{color:var(--gold);border-color:var(--gold)}

  .actions .platinput{
    background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:7px 8px;font-size:.85rem;width:110px;
  }
  .actions .platinput:focus{outline:none;border-color:var(--gold)}
  .actions .oldcnt{width:60px;text-align:center}
  .actions .namefield{width:100%}

  .stars{margin-top:3px;font-size:.72rem;letter-spacing:.15em;color:var(--gold);
    text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .meta{margin-top:3px;font-size:.72rem;color:var(--text-dim);letter-spacing:.02em}
  .meta .tp{color:var(--gold);opacity:.9}
  .cs{
    display:inline-block;margin-left:8px;padding:0 5px;border-radius:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;letter-spacing:0;
    border:1px solid var(--border-dim);color:var(--text-dim);vertical-align:1px;
  }
  .cs.hi{color:var(--green);border-color:var(--green)}
  .cs.mid{color:var(--gold);border-color:var(--gold)}
  .stars .off{color:var(--border-dim);opacity:.55}
  .rate{display:flex;gap:2px}
  .rate .star{
    border:none;background:none;cursor:pointer;padding:4px 3px;
    font-size:1.15rem;line-height:1;color:var(--border-dim);
  }
  .rate .star.on{color:var(--gold);text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .rate .star:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:4px}

  .actions{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(201,211,238,.25);
    flex-wrap:wrap;gap:6px;align-items:center}
  .card.open .actions{display:flex}
  .actions .btn{padding:7px 10px;font-size:.82rem}
  .actions select{
    background:rgba(6,10,34,.7);border:1.5px solid var(--border-dim);border-radius:8px;
    color:var(--text);padding:7px 8px;font-size:.85rem;
  }
  .actions select.gold{border-color:var(--gold);color:var(--gold)}
  .actions .del{border-color:var(--danger);color:var(--danger);margin-left:auto}
  .mpair{display:inline-flex;gap:4px;align-items:stretch}
  .xmark{align-self:center;color:var(--gold);font-size:1rem;padding:0 2px}
  .mpair .nomerge{padding:7px 9px;color:var(--text-dim)}
  .mchoose{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;
    font-size:.8rem;color:var(--text-dim)}

  .empty{color:var(--text-dim);text-align:center;padding:26px 10px;font-size:.9rem}

  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--win-bot);border:1.5px solid var(--gold);color:var(--text);
    border-radius:8px;padding:9px 16px;font-size:.88rem;max-width:90%;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;text-align:center;
  }
  .toast.show{opacity:1}
  input[type=file]{display:none}

  /* ---- desktop ≥860px: wide two-column list ---- */
  @media (min-width:860px){
    body{max-width:1024px;}
    .sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;align-items:start}
    .sec>.yearhead{grid-column:1/-1}
  }
</style>
</head>
<body>

<header class="win" style="position:relative">
  <button class="gear" id="gearBtn" aria-label="Настройки синхронизации">⚙</button>
  <h1>Журнал игр</h1>
  <div class="subtitle">беклог · прогресс · история прохождений</div>
  <div class="stats">
    <div class="stat playing"><b id="stPlaying">0</b><span>играю</span></div>
    <div class="stat backlog"><b id="stBacklog">0</b><span>беклог</span></div>
    <div class="stat done"><b id="stDone">0</b><span>пройдено</span></div>
  </div>
  <div class="fstatus" id="fstatus" hidden></div>
  <div class="sync" id="syncPanel" hidden>
    <select id="langSel" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
    <input id="gsUrl" placeholder="Google Apps Script URL (…/exec)" autocomplete="off">
    <div class="hint" style="text-align:center" id="orGist">— или через GitHub Gist —</div>
    <input id="ghToken" type="password" placeholder="GitHub token" autocomplete="off">
    <input id="ghGist" placeholder="Gist ID" autocomplete="off">
    <div class="row2">
      <button class="btn gold" id="syncConnect">Подключить</button>
      <button class="btn" id="syncOff">Отключить</button>
    </div>
    <div class="hint" id="syncHint"></div>
    <div class="row2">
      <button class="btn" id="csvBtn">Импорт CSV</button>
      <button class="btn" id="bakBtn">Бэкап</button>
      <button class="btn" id="resBtn">Восстановить</button>
    </div>
    <button class="btn" id="nodataBtn">Игры без данных Playnite</button>
    <button class="btn" id="resetNoMergeBtn" hidden></button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-f="all">Все</button>
  <button class="tab" data-f="playing">Играю</button>
  <button class="tab" data-f="backlog">Беклог</button>
  <button class="tab" data-f="done">Пройдено</button>
  <button class="tab" data-f="dropped">Брошено</button>
  <button class="tab" data-f="catalog">Каталог</button>
  <button class="tab" data-f="fav">⚑ Избранное</button>
</nav>

<div class="bar mainbar">
  <span class="searchwrap">
    <input id="search" type="search" placeholder="Поиск по играм…" autocomplete="off">
    <button id="clearSearch" aria-label="Очистить" hidden>✕</button>
  </span>
  <button class="btn gold" id="addBtn">+ Добавить</button>
</div>

<div class="bar sortrow"><select id="sortSel"></select></div>

<main id="list"></main>

<input type="file" id="csvFile" accept=".csv,text/csv">
<input type="file" id="jsonFile" accept=".json,application/json">
<datalist id="platformList"></datalist>
<datalist id="sourceList"></datalist>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= data ================= */
var KEY="gamelog-v1";

var STATUS_KEYS=["backlog","playing","done","dropped"];

ru:{

  tab_all:"Все",tab_catalog:"Каталог",tab_fav:"⚑ Избранное",fav_on:"⚑ В избранное",fav_off:"⚑ Убрать из избранного",search_ph:"Поиск по играм…",add_btn:"+ Добавить",prompt_name:"Название игры:",
  dice_bar:"🎲 Во что поиграть? Пусть решит судьба",dice_aria:"Случайная игра из беклога",
  dice_none:"Беклог пуст — вот это достижение!",dice_pick:"Судьба выбрала: ",

if(!TR[lang])lang="ru";
function t(k){return (TR[lang]&&TR[lang][k])!==undefined?TR[lang][k]:(TR.ru[k]||k);}
function stLabel(s){return t("st_"+s);}
var COMMON_PLATFORMS=["PC","PS5","PS4","PS3","PS2","PS1","PSP","PS Vita","Xbox Series","Xbox 360",
  "Switch","Switch 2","Wii","GameCube","N64","SNES","NES","GBA","DS","3DS","Saturn","Dreamcast","Genesis","Steam Deck","Android"];

var storageOK=true;

function seed(){
  // стартовое состояние пустое: реальные данные приезжают из синка (гиста)
  return {nextId:1,games:[],collapsed:{}};
}

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);if(p&&p.games)return p;}
  }catch(e){storageOK=false;}
  return seed();
}
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){
    if(storageOK){storageOK=false;toast(t("storage_warn"));}
  }
  scheduleFileWrite();
  schedulePush();
}
var state=load();
migrate(state);
try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}

function cleanPlat(p){
  return p.replace(/\s*\(Windows\)/i,"")
    .replace(/^Microsoft\s+/i,"")
    .replace(/^Nintendo\s+/i,"")
    .replace(/^Sony\s+/i,"")
    .replace(/^PlayStation\s*/i,"PS")
    .replace(/^Sega\s+/i,"")
    .trim();
}
function migrate(st){
  if(!st.collapsed)st.collapsed={};
  if(!Array.isArray(st.noMerge))st.noMerge=[];
  (st.games||[]).forEach(function(g){
    if(!Array.isArray(g.years)){
      g.years=(g.status==="done")?[g.year||0]:[];
      delete g.year;
    }
    if(g.platform)g.platform=cleanPlat(g.platform);
    if(g.oldCount&&g.oldCount>1){
      g.counts=g.counts||{};
      if(!g.counts[0])g.counts[0]=g.oldCount;
    }
    delete g.oldCount;
  });
  return st;
}
function cnt(g,y){return (g.counts&&g.counts[y])||1;}
function addYear(g,y){
  if(g.years.indexOf(y)===-1){g.years.push(y);g.years.sort(function(a,b){return a-b;});}
}
function yLabel(y){return +y===0?t("long_ago"):y;}

var fileHandle=null,fsTimer=null;
function canFS(){return typeof window.showSaveFilePicker==="function";}
function setFStatus(name){

  else el.hidden=true;

function writeToFile(){
  if(!fileHandle)return;
  fileHandle.createWritable().then(function(w){
    return w.write(JSON.stringify(state,null,2)).then(function(){return w.close();});
  }).catch(function(err){

}

var SKEY="gamelog-sync-v1";
var syncCfg={token:"",gist:""};
try{var sc=localStorage.getItem(SKEY);if(sc)syncCfg=JSON.parse(sc);}catch(e){}
var pushTimer=null,syncBusy=false;

function syncOn(){return !!(syncCfg.gs||(syncCfg.token&&syncCfg.gist));}
function syncLabel(){return syncCfg.gs?"drive":"gist";}
function saveSyncCfg(){try{localStorage.setItem(SKEY,JSON.stringify(syncCfg));}catch(e){}}
function nowTime(){
  var d=new Date();
  return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function setStatus(text,err){
  var el=document.getElementById("fstatus");
  if(!text){el.hidden=true;return;}
  el.textContent=text;el.hidden=false;
  el.classList.toggle("err",!!err);
}
function gh(method,path,body){
  return fetch("https://api.github.com"+path,{
    method:method,
    headers:{
      "Authorization":"Bearer "+syncCfg.token,
      "Accept":"application/vnd.github+json"
    },
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(!r.ok)throw new Error("GitHub: "+r.status+(r.status===401?" — токен не подошёл":""));
    return r.json();
  });
}
function remoteGet(){
  if(syncCfg.gs){
    return fetch(syncCfg.gs).then(function(r){
      if(!r.ok)throw new Error("Drive: "+r.status);
      return r.text();
    }).then(function(t){
      try{return JSON.parse(t);}catch(e){return null;} // пустой/новый файл
    });
  }
  return gh("GET","/gists/"+syncCfg.gist).then(function(g){
    var f=g.files&&g.files["game-log.json"];
    if(!f||!f.content)return null;
    return JSON.parse(f.content);
  });
}
function remotePut(){
  if(syncCfg.gs){
    // без заголовков: text/plain обходит preflight, который Apps Script не умеет
    return fetch(syncCfg.gs,{method:"POST",body:JSON.stringify(state)}).then(function(r){
      if(!r.ok)throw new Error("Drive: "+r.status);
    });
  }
  return gh("PATCH","/gists/"+syncCfg.gist,
    {files:{"game-log.json":{content:JSON.stringify(state)}}});
}
function pushRemote(){
  if(!syncOn()||syncBusy)return;
  syncBusy=true;
  remotePut()
  .then(function(){setStatus(syncLabel()+" · "+t("sync")+" "+nowTime());})
  .catch(function(e){setStatus(t("offline"),true);})
  .then(function(){syncBusy=false;});
}
function schedulePush(){
  if(!syncOn())return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushRemote,1500);
}
function pullRemote(){
  if(!syncOn())return;
  setStatus(syncLabel()+" · "+t("syncing"));
  remoteGet().then(function(remote){
    if(!remote||!Array.isArray(remote.games)){pushRemote();return;} // там пусто — заливаем своё
    var r=remote.updatedAt||0,l=state.updatedAt||0;
    if(r>l){
      state=migrate(remote);
      openId=null;
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
      render();
      setStatus(syncLabel()+" · "+t("sync")+" "+nowTime());
    }else if(l>r){
      pushRemote();
    }else setStatus(syncLabel()+" · "+t("sync")+" "+nowTime());
  }).catch(function(e){setStatus(t("offline_local")+" ("+e.message+")",true);});
}

function sortItems(arr){
  if(sortMode==="default")return arr;
  var c=arr.slice();
  if(sortMode==="name")c.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});});
  else c.sort(function(a,b){return (b[sortMode]||0)-(a[sortMode]||0);}); // числовые — по убыванию, пустые в конец
  return c;
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},2600);
}

  if(g.platform)chips+='<span class="plat">'+esc(g.platform)+'</span>';
  if(g.source)chips+='<span class="src">'+esc(g.source)+'</span>';
  if(g.series)chips+='<span class="ser" data-act="serfilter">❖ '+esc(g.series)+'</span>';
  chips+=histChip+noteChip;
  var chipsView=chips?'<div class="chips">'+chips+'</div>':"";

  return '<div class="card win '+g.status+(open?" open":"")+'" data-id="'+g.id+'" data-ctx="'+(ctx===null?"s":ctx)+'">'
    +'<span class="cursor">▶</span>'
    +'<div class="row"><span class="name">'+esc(g.name)+'</span>'
    +(g.fav?'<span class="favmark" title="⚑">⚑</span>':"")
    +badge+'</div>'
    +chipsView
    +metaView
    +starsView
    +(open?'<div class="actions">'+actions+'</div>':"")+'</div>';
}
function render(){
  var c=counts();
  document.getElementById("stPlaying").textContent=c.playing;
  document.getElementById("stBacklog").textContent=c.backlog;
  document.getElementById("stDone").textContent=c.done;

  var q=norm(query);
  var noData=query.trim().toLowerCase()==="#nodata";
  function matches(g){
    if(noData)return !g.source&&!g.genres&&!g.cs;
    if(!q)return true;
    // строго по началу названия; плюс точное имя серии — для чипа ❖
    if(norm(g.name).indexOf(q)===0)return true;
    return !!(g.series&&norm(g.series)===q);
  }
  var bySearch=state.games.filter(matches);
  var shown=bySearch.filter(function(g){
    if(filter==="fav")return !!g.fav;
    return filter==="all"||filter==="catalog"||g.status===filter;
  });

  // платформы и лончеры для подсказок: стандартные + те, что уже введены
  var plats={},srcs={};
  COMMON_PLATFORMS.forEach(function(p){plats[p]=1;});
  COMMON_SOURCES.forEach(function(s){srcs[s]=1;});
  state.games.forEach(function(g){
    if(g.platform)plats[g.platform]=1;
    if(g.source)srcs[g.source]=1;
  });
  document.getElementById("platformList").innerHTML=
    Object.keys(plats).map(function(p){return '<option value="'+esc(p)+'">';}).join("");
  document.getElementById("sourceList").innerHTML=
    Object.keys(srcs).map(function(s){return '<option value="'+esc(s)+'">';}).join("");

  var html="";
  // сводка серии: если запрос совпадает с названием серии
  if(q&&!noData){
    var serGames=state.games.filter(function(g){return g.series&&norm(g.series)===q;});
    if(serGames.length>1){
      var runs=0,doneN=0;
      serGames.forEach(function(g){
        g.years.forEach(function(y){runs+=cnt(g,y);});
        if(g.years.length)doneN++;
      });
      html+='<div class="sersum">❖ <b>'+esc(serGames[0].series)+'</b> — '
        +'<span class="n">'+serGames.length+'</span>'+t("ser_games")+' · '
        +'<span class="n">'+doneN+'</span>'+t("ser_done")+' · '
        +'<span class="n">'+runs+'</span>'+t("ser_runs")+'</div>';
    }
  }
  function section(key,title,items,ctx){
    if(!items.length)return"";
    items=sortItems(items);
    var col=!!state.collapsed[key];
    var extra=key==="backlog"?'<button class="dice" data-dice aria-label="'+t("dice_aria")+'">🎲</button>':"";
    return '<section class="sec">'
      +'<div class="yearhead'+(col?' col':'')+'" data-key="'+key
      +'" role="button" tabindex="0" aria-expanded="'+(!col)+'">'
      +'<span class="caret">▾</span><b>'+title+'</b>'
      +'<span class="line"></span>'+extra+'<span class="cnt">'+items.length+'</span></div>'
      +(col?"":items.map(function(g){return cardHTML(g,ctx);}).join(""))
      +'</section>';
  }
  var hasAnything=filter==="done"?bySearch.some(function(g){return g.years.length;}):shown.length;
  if(!hasAnything){
    html='<div class="empty">'+((q||noData)?t("empty_search"):t("empty"))+'</div>';
  }else if(filter==="done"||filter==="all"){
    // группировка: играю → беклог → пройдено по годам → брошено
    if(filter==="all"){
      html+=section("playing",stLabel("playing"),shown.filter(function(g){return g.status==="playing";}),null);
      html+=section("backlog",stLabel("backlog"),shown.filter(function(g){return g.status==="backlog";}),null);
    }
    // годовые группы: по истории прохождений, независимо от текущего статуса
    var years={};
    bySearch.forEach(function(g){
      g.years.forEach(function(y){(years[y]=years[y]||[]).push(g);});
    });
    Object.keys(years)
      .sort(function(a,b){return (+b)-(+a);})
      .forEach(function(y){
        html+=section("y"+y,stLabel("done")+" · "+yLabel(y),years[y],+y);
      });
    if(filter==="all"){
      html+=section("dropped",stLabel("dropped"),shown.filter(function(g){return g.status==="dropped";}),null);
    }
  }else{
    if(filter==="backlog"&&shown.length){
      html+='<button class="dicebar" data-dice>'+t("dice_bar")+'</button>';
    }
    html+=section(filter,filter==="catalog"?t("tab_catalog"):(filter==="fav"?t("tab_fav"):stLabel(filter)),shown,null);
  }
  document.getElementById("list").innerHTML=html;

}

function sugValues(kind){
  var set={};
  if(kind==="plat")COMMON_PLATFORMS.forEach(function(v){set[v]=1;});
  if(kind==="src")COMMON_SOURCES.forEach(function(v){set[v]=1;});
  state.games.forEach(function(g){
    var v=kind==="plat"?g.platform:(kind==="src"?g.source:g.series);
    if(v)set[v]=1;
  });
  return Object.keys(set);
}
function fillSug(input){

  var box=input.parentElement.querySelector(".sug");

  var vals=sugValues(kind).filter(function(v){
    return v.toLowerCase()!==q&&(!q||v.toLowerCase().indexOf(q)!==-1);
  }).slice(0,12);
  box.innerHTML=vals.map(function(v){
    return '<button type="button" class="sugbtn" data-sug="'+esc(v)+'">'+esc(v)+'</button>';
  }).join("");
}

function scrollToCard(el){
  // content-visibility даёт лишь оценочные высоты карточек за экраном,
  // поэтому корректируем позицию несколькими прыжками, пока размеры не устаканятся
  var tries=0;
  (function step(){
    if(!el.isConnected)return;
    el.scrollIntoView({block:"center"});
    if(++tries<5)setTimeout(step,90);
  })();
}

function renderKeepScroll(anchorEl){
  var aid=null,actx=null,top=0;
  if(anchorEl&&anchorEl.dataset){
    aid=anchorEl.dataset.id;actx=anchorEl.dataset.ctx;
    top=anchorEl.getBoundingClientRect().top;
  }
  render();
  if(aid!=null){
    var el=document.querySelector('.card[data-id="'+aid+'"][data-ctx="'+actx+'"]');
    if(el)window.scrollBy(0,el.getBoundingClientRect().top-top);
  }
}
function siblingCard(card){
  var n=card.nextElementSibling;
  if(n&&n.classList&&n.classList.contains("card"))return n;
  var p=card.previousElementSibling;
  if(p&&p.classList&&p.classList.contains("card"))return p;
  return null;
}
function patchCardByKey(k){
  if(!k)return;
  var parts=k.split("@");
  var g=state.games.find(function(x){return x.id===+parts[0];});
  if(!g)return;
  var el=document.querySelector('.card[data-id="'+parts[0]+'"][data-ctx="'+parts[1]+'"]');
  if(!el){render();return;}
  var tmp=document.createElement("div");
  tmp.innerHTML=cardHTML(g,parts[1]==="s"?null:+parts[1]);
  el.replaceWith(tmp.firstChild);
}

var lastDice=null;
document.getElementById("list").addEventListener("click",function(e){
  var dice=e.target.closest("[data-dice]");
  if(dice){
    var pool=state.games.filter(function(g){return g.status==="backlog";});
    if(!pool.length){toast(t("dice_none"));return;}
    var pick;
    do{pick=pool[Math.floor(Math.random()*pool.length)];}
    while(pool.length>1&&pick.id===lastDice);
    lastDice=pick.id;
    state.collapsed["backlog"]=false;
    openId=pick.id+"@s";
    render();
    var el=document.querySelector('.card[data-id="'+pick.id+'"][data-ctx="s"]');
    if(el){
      el.classList.add("chosen");
      scrollToCard(el);
    }
    toast(t("dice_pick")+"«"+pick.name+"»");
    return;
  }
  var head=e.target.closest(".yearhead");
  if(head){
    var k=head.dataset.key;
    var willCollapse=!state.collapsed[k];
    state.collapsed[k]=willCollapse;
    save();render();
    if(willCollapse){
      var h=document.querySelector('.yearhead[data-key="'+k+'"]');
      if(h)h.scrollIntoView({block:"nearest"});
    }
    return;
  }
  var card=e.target.closest(".card");if(!card)return;
  var id=+card.dataset.id;
  var ctxRaw=card.dataset.ctx;
  var ctx=ctxRaw==="s"?null:+ctxRaw;
  var key=id+"@"+ctxRaw;
  var g=state.games.find(function(x){return x.id===id;});if(!g)return;
  var act=e.target.dataset.act;
  var cy=new Date().getFullYear();
  if(act==="serfilter"){
    query=g.series;
    document.getElementById("search").value=g.series;
    syncClearBtn();
    render();
    scrollToResults();return;
  }
  if(!act){
    if(e.target.closest("input,select,textarea"))return; // поля ввода не сворачивают карточку
    var prev=openId;
    openId=(openId===key?null:key);
    mergeAsk=null;
    patchCardByKey(prev);
    if(openId&&openId!==prev)patchCardByKey(openId);
    return;
  }
  if(act==="status"){
    var s=e.target.dataset.s;
    g.status=s;
    if(s==="done")addYear(g,e.target.dataset.old?0:cy);
    // историю прохождений при смене статуса НЕ трогаем
    var anchor2=siblingCard(card);
    save();renderKeepScroll(anchor2);return;
  }
  if(act==="addyear"){
    addYear(g,cy);
    if(g.status==="backlog")g.status="done";
    save();render();
    toast("«"+g.name+"» "+t("added_to")+cy);return;
  }
  if(act==="rmyear"){
    g.years=g.years.filter(function(y){return y!==ctx;});
    if(g.counts)delete g.counts[ctx];
    if(!g.years.length&&g.status==="done"){
      g.status="backlog";
      toast(t("no_runs_left"));
    }
    openId=null;save();render();return;
  }
  if(act==="fav"){
    g.fav=!g.fav;
    save();render();return;
  }
  if(act==="rate"){
    var v=+e.target.dataset.v;
    g.rating=(g.rating===v?null:v);
    save();render();return;
  }
  if(act==="mergeask"){
    mergeAsk={id:g.id,mid:+e.target.dataset.mid};
    render();return;
  }
  if(act==="mergecancel"){
    mergeAsk=null;render();return;
  }
  if(act==="nomerge"){
    var oid=+e.target.dataset.mid;
    var pk=Math.min(g.id,oid)+"-"+Math.max(g.id,oid);
    if(state.noMerge.indexOf(pk)===-1)state.noMerge.push(pk);
    mergeAsk=null;save();render();
    toast(t("nomerge_done"));return;
  }
  if(act==="mergekeep"){
    var other=state.games.find(function(x){return x.id===+e.target.dataset.mid;});
    if(!other)return;
    var keep=e.target.dataset.keep==="this"?g:other;
    var absorb=keep===g?other:g;
    // годы и счётчики
    absorb.years.forEach(function(y){addYear(keep,y);});
    if(absorb.counts){
      keep.counts=keep.counts||{};
      for(var ck in absorb.counts){
        if((absorb.counts[ck]||1)>(keep.counts[ck]||1))keep.counts[ck]=absorb.counts[ck];
      }
    }
    // статус: берём более «продвинутый»
    var rank={backlog:0,dropped:1,playing:2,done:3};
    if(rank[absorb.status]>rank[keep.status])keep.status=absorb.status;
    // поля: у остающейся приоритет, пустоты добираем у второй
    ["platform","source","genres","rel","cs","rating","series"].forEach(function(k){
      if(!keep[k]&&absorb[k])keep[k]=absorb[k];
    });
    if((absorb.time||0)>(keep.time||0))keep.time=absorb.time;
    if(absorb.fav)keep.fav=true;
    if(absorb.note)keep.note=keep.note?(keep.note+"\n"+absorb.note):absorb.note;
    state.games=state.games.filter(function(x){return x.id!==absorb.id;});
    // чистим записи noMerge с удалённым id
    state.noMerge=state.noMerge.filter(function(pk2){
      return pk2.split("-").indexOf(String(absorb.id))===-1;
    });
    mergeAsk=null;openId=null;save();render();
    toast(t("merged")+"«"+keep.name+"»");
    return;
  }
  if(act==="del"){
    if(confirm(t("confirm_del").replace("{n}",g.name))){
      state.games=state.games.filter(function(x){return x.id!==id;});
      openId=null;save();render();
    }
    return;
  }
});

document.getElementById("list").addEventListener("change",function(e){

  if(["year","plat","src","oldcount","addyearsel","note","rel","genres","series","rename"].indexOf(act)===-1)return;
  var card=e.target.closest(".card");

  if(!g)return;
  if(act==="rename"){

    var clash=state.games.find(function(x){return x.id!==g.id&&norm(x.name)===norm(nn);});
    if(clash){toast("«"+clash.name+"» "+t("already")+" ("+stLabel(clash.status)+")");render();return;}
    g.name=nn;save();render();
  }
  else if(act==="note"){g.note=e.target.value.trim()||null;save();render();}
  else if(act==="year"){
    var oldY=card.dataset.ctx==="s"?null:+card.dataset.ctx;
    var newY=+e.target.value;
    if(oldY!==null){
      g.years=g.years.filter(function(y){return y!==oldY;});
      addYear(g,newY);
      if(g.counts&&g.counts[oldY]){
        var mv=g.counts[oldY];delete g.counts[oldY];
        if(mv>(g.counts[newY]||1))g.counts[newY]=mv;
      }
      openId=g.id+"@"+newY;
    }
    save();render();
  }
  else if(act==="oldcount"){
    var cy2=+card.dataset.ctx;
    var v2=Math.max(1,Math.min(99,parseInt(e.target.value,10)||1));
    g.counts=g.counts||{};
    if(v2>1)g.counts[cy2]=v2;else delete g.counts[cy2];
    save();render();
  }
  else if(act==="addyearsel"){
    var raw=e.target.value;
    if(raw){
      var v=raw==="old"?0:+raw;
      addYear(g,v);
      var pc=card.querySelector('[data-role=precount]');
      var pcv=pc?Math.max(1,Math.min(99,parseInt(pc.value,10)||1)):1;
      if(pcv>1){g.counts=g.counts||{};g.counts[v]=pcv;}
      if(g.status==="backlog"||g.status==="playing")g.status="done";
      var anchor=siblingCard(card);
      save();renderKeepScroll(anchor);
      toast("«"+g.name+"» "+t("added_to")+yLabel(v)+(pcv>1?" ×"+pcv:""));
    }
  }
  else if(act==="plat"){g.platform=e.target.value.trim()||null;save();render();}
  else if(act==="rel"){var rv=parseInt(e.target.value,10);g.rel=(rv>=1970&&rv<=2030)?rv:null;save();render();}
  else if(act==="genres"){g.genres=e.target.value.trim()||null;save();render();}
  else if(act==="series"){g.series=e.target.value.trim()||null;save();render();}
  else{g.source=e.target.value.trim()||null;save();render();}
});

/* ================= CSV import (Playnite) ================= */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  // определяем разделитель по первой строке
  var firstLine=text.slice(0,text.indexOf("\n"));
  var delim=(firstLine.split(";").length>firstLine.split(",").length)?";":",";
  var rows=[],row=[],cur="",inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      }else cur+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===delim){row.push(cur);cur="";}
      else if(ch==="\n"||ch==="\r"){
        if(ch==="\r"&&text[i+1]==="\n")i++;
        row.push(cur);cur="";
        if(row.length>1||row[0]!=="")rows.push(row);
        row=[];
      }else cur+=ch;
    }
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function mapStatus(s){
  s=(s||"").toLowerCase();
  if(/beaten|completed|пройден|заверш/.test(s))return"done";
  if(/^playing|играю/.test(s))return"playing";
  if(/abandon|брошен/.test(s))return"dropped";
  return"backlog"; // Not Played, Plan to Play, On Hold и всё прочее
}
document.getElementById("csvBtn").addEventListener("click",function(){
  document.getElementById("csvFile").click();
});
document.getElementById("csvFile").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var rows=parseCSV(r.result);
      if(rows.length<2){toast(t("imp_none"));return;}
      var head=rows[0].map(function(h){return h.trim().toLowerCase();});
      var iName=-1,iStatus=-1,iPlat=-1,iScore=-1,iSrc=-1,iGen=-1,iRel=-1,iTime=-1,iComm=-1,iSer=-1,iFav=-1;
      head.forEach(function(h,i){
        if(iName===-1&&/^(name|название|game|title|игра)$/.test(h))iName=i;
        if(iStatus===-1&&/completion|статус прохожд/.test(h))iStatus=i;
        if(iPlat===-1&&/^(platform|platforms|платформа|платформы)$/.test(h))iPlat=i;
        if(iScore===-1&&/user\s*score|оценка/.test(h))iScore=i;
        if(iSrc===-1&&/^(source|sources|library|источник|лончер|библиотека)$/.test(h))iSrc=i;
        if(iGen===-1&&/^(genres|genre|жанры|жанр)$/.test(h))iGen=i;
        if(iRel===-1&&/^release\s*date$/.test(h))iRel=i;
        if(iTime===-1&&/^time\s*played$/.test(h))iTime=i;
        if(iComm===-1&&/^community\s*score$/.test(h))iComm=i;
        if(iSer===-1&&/^(series|серия)$/.test(h))iSer=i;
        if(iFav===-1&&/^(favorite|избранное)$/.test(h))iFav=i;
      });
      if(iName===-1){toast(t("imp_nocol"));return;}
      var existing={};
      state.games.forEach(function(g){existing[norm(g.name)]=g;});
      var added=0,updated=0;
      for(var i=1;i<rows.length;i++){
        var name=(rows[i][iName]||"").trim();
        if(!name)continue;
        var st=iStatus>-1?mapStatus(rows[i][iStatus]):"backlog";
        var plat=iPlat>-1?cleanPlat((rows[i][iPlat]||"").split(/[,;]/)[0]):"";
        var src=iSrc>-1?(rows[i][iSrc]||"").trim():"Playnite"; // игра из CSV точно есть в библиотеке
        var genres=iGen>-1?(rows[i][iGen]||"").split(",").slice(0,2).map(function(x){return x.trim();}).filter(Boolean).join(", "):"";
        var rel=0;
        if(iRel>-1){var rm=(rows[i][iRel]||"").match(/(19|20)\d{2}/);if(rm)rel=+rm[0];}
        var tsec=iTime>-1?(parseInt(rows[i][iTime],10)||0):0;
        var cs=iComm>-1?(parseInt(rows[i][iComm],10)||0):0;
        var ser=iSer>-1?(rows[i][iSer]||"").split(",")[0].trim():"";
        var fav=iFav>-1&&/^true$/i.test((rows[i][iFav]||"").trim());
        var rating=null;
        if(iScore>-1){
          var sc=parseFloat(rows[i][iScore]);
          if(!isNaN(sc)&&sc>0)rating=Math.max(1,Math.min(5,Math.round(sc/20)));
        }
        var key=norm(name);
        if(existing[key]){
          // не трогаем то, что уже размечено вручную; статус подтягиваем только из беклога вверх
          var g=existing[key];
          if(g.status==="backlog"&&st!=="backlog"){
            g.status=st;
            if(st==="done")addYear(g,0); // год неизвестен — «Давно»
            updated++;
          }
          if(!g.platform&&plat)g.platform=plat;
          if(!g.rating&&rating)g.rating=rating;
          if((!g.source||g.source==="Playnite")&&src)g.source=src; // заглушку уточняем настоящим лончером
          if(!g.genres&&genres)g.genres=genres;
          if(!g.rel&&rel)g.rel=rel;
          if(tsec>(g.time||0))g.time=tsec; // наигранное время только растёт
          if(cs)g.cs=cs; // народная оценка — всегда свежая из CSV
          if(ser)g.series=ser; // серия — приоритет у Playnite
          if(fav)g.fav=true; // избранное из Playnite добавляет, но не снимает
        }else{
          var ng={id:state.nextId++,name:name,status:st,
            years:st==="done"?[0]:[], // импортированные прохождения — в «Давно»
            platform:plat||null,rating:rating,source:src||null,
            genres:genres||null,rel:rel||null,time:tsec||null,cs:cs||null,series:ser||null,fav:fav||undefined};
          state.games.push(ng);existing[key]=ng;added++;
        }
      }
      save();render();
      toast(t("imp_done")+added+(updated?t("imp_upd")+updated:""));
    }catch(err){toast(t("imp_fail")+err.message);}
    e.target.value="";
  };
  r.readAsText(f);
});

/* ================= файл данных: сохранить / открыть ================= */
function applyLoaded(p,srcName){
  if(!p||!Array.isArray(p.games))throw new Error("не тот формат");
  state=migrate(p);
  openId=null;
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  render();
  toast(t("restored")+srcName+": "+p.games.length+t("games_w"));
}

document.getElementById("bakBtn").addEventListener("click",function(){
  if(fileHandle){writeToFile();toast(t("bak_done"));return;}
  if(canFS()){
    window.showSaveFilePicker({
      suggestedName:"game-log.json",
      types:[{description:"Данные журнала",accept:{"application/json":[".json"]}}]
    }).then(function(h){
      fileHandle=h;setFStatus(h.name);writeToFile();
      toast(t("bak_done"));
    }).catch(function(err){
      if(err&&err.name==="AbortError")return;
      downloadJSON();
    });
    return;
  }
  downloadJSON();
});
function downloadJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="game-log.json";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast(t("bak_done"));
}

document.getElementById("resBtn").addEventListener("click",function(){
  if(canFS()&&typeof window.showOpenFilePicker==="function"){
    window.showOpenFilePicker({
      types:[{description:"Данные журнала",accept:{"application/json":[".json"]}}]
    }).then(function(hs){
      var h=hs[0];
      return h.getFile().then(function(f){return f.text();}).then(function(t){
        applyLoaded(JSON.parse(t),h.name);
        fileHandle=h;setFStatus(h.name);
      });
    }).catch(function(err){
      if(err&&err.name==="AbortError")return;
      toast(t("not_backup")+err.message);
    });
    return;
  }
  document.getElementById("jsonFile").click();
});
document.getElementById("jsonFile").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{applyLoaded(JSON.parse(r.result),f.name);}
    catch(err){toast(t("not_backup")+err.message);}
    e.target.value="";
  };
  r.readAsText(f);
});

/* ================= панель синхронизации ================= */
function refreshNoMergeBtn(){
  var b=document.getElementById("resetNoMergeBtn");
  var n=(state.noMerge||[]).length;
  b.hidden=!n;
  b.textContent=t("reset_nomerge")+" ("+n+")";
}
document.getElementById("gearBtn").addEventListener("click",function(){
  var p=document.getElementById("syncPanel");
  p.hidden=!p.hidden;
  refreshNoMergeBtn();
  if(!p.hidden){
    document.getElementById("gsUrl").value=syncCfg.gs||"";
    document.getElementById("ghToken").value=syncCfg.token||"";
    document.getElementById("ghGist").value=syncCfg.gist||"";
  }
});
document.getElementById("syncConnect").addEventListener("click",function(){
  var gs=document.getElementById("gsUrl").value.trim();
  var tok=document.getElementById("ghToken").value.trim();
  var g=document.getElementById("ghGist").value.trim();
  if(gs){
    if(gs.indexOf("https://script.google.com/")!==0){
      toast(t("bad_url"));return;
    }
    syncCfg={gs:gs,token:"",gist:""};saveSyncCfg();
    pullRemote();
    document.getElementById("syncPanel").hidden=true;
    toast(t("connected_drive"));
    return;
  }
  if(!tok){toast(t("need_token"));return;}
  syncCfg={gs:"",token:tok,gist:g};
  if(g){
    saveSyncCfg();
    pullRemote();
    document.getElementById("syncPanel").hidden=true;
    toast(t("connected"));
  }else{
    gh("POST","/gists",{
      description:"Game log — журнал игр",
      "public":false,
      files:{"game-log.json":{content:JSON.stringify(state)}}
    }).then(function(res){
      syncCfg.gist=res.id;saveSyncCfg();
      document.getElementById("ghGist").value=res.id;
      setStatus("gist · "+t("sync")+" "+nowTime());
      toast(t("gist_created"));
    }).catch(function(e){toast(t("gist_fail")+e.message);});
  }
});
document.getElementById("syncOff").addEventListener("click",function(){
  syncCfg={gs:"",token:"",gist:""};saveSyncCfg();
  setStatus(null);
  toast(t("sync_off"));
});
window.addEventListener("online",function(){if(syncOn())pullRemote();});

/* ================= язык ================= */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelector("h1").textContent=t("title");
  document.title=t("title");
  document.querySelector(".subtitle").textContent=t("subtitle");
  var statSpans=document.querySelectorAll(".stat span");
  statSpans[0].textContent=t("stat_playing");
  statSpans[1].textContent=t("stat_backlog");
  statSpans[2].textContent=t("stat_done");
  document.querySelectorAll(".tab").forEach(function(tb){
    var f=tb.dataset.f;
    tb.textContent=f==="all"?t("tab_all"):(f==="catalog"?t("tab_catalog"):(f==="fav"?t("tab_fav"):stLabel(f)));
  });
  document.getElementById("search").placeholder=t("search_ph");
  document.getElementById("addBtn").textContent=t("add_btn");
  document.getElementById("gsUrl").placeholder=t("ph_gs");
  document.getElementById("orGist").textContent=t("or_gist");
  document.getElementById("ghToken").placeholder=t("ph_token");
  document.getElementById("ghGist").placeholder=t("ph_gist");
  document.getElementById("syncConnect").textContent=t("connect");
  document.getElementById("syncOff").textContent=t("disconnect");
  document.getElementById("syncHint").textContent=t("hint");
  document.getElementById("csvBtn").textContent=t("csv");
  document.getElementById("bakBtn").textContent=t("backup");
  document.getElementById("resBtn").textContent=t("restore");
  document.getElementById("nodataBtn").textContent=t("nodata");
  refreshNoMergeBtn();
  var ss=document.getElementById("sortSel");
  ss.innerHTML=["default","name","cs","rating","rel","time"].map(function(m){
    return '<option value="'+m+'">'+t("sort_"+m)+'</option>';
  }).join("");
  ss.value=sortMode;
  document.getElementById("langSel").value=lang;
  render();
}

document.getElementById("sortSel").addEventListener("change",function(e){
  sortMode=e.target.value;
  try{localStorage.setItem(SORTKEY,sortMode);}catch(err){}
  render();
});
document.getElementById("resetNoMergeBtn").addEventListener("click",function(){
  state.noMerge=[];
  save();render();refreshNoMergeBtn();
  toast(t("nomerge_reset"));
});
document.getElementById("nodataBtn").addEventListener("click",function(){
  document.getElementById("search").value="#nodata";
  query="#nodata";
  syncClearBtn();
  document.getElementById("syncPanel").hidden=true;
  render();
  scrollToResults();
});
document.getElementById("langSel").addEventListener("change",function(e){
  lang=e.target.value;
  try{localStorage.setItem(LKEY,lang);}catch(err){}
  applyLang();
});

applyLang();
if(syncOn())pullRemote();
})();
</script>
