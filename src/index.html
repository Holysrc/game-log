<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23f9e7ae'/%3E%3Cstop offset='.5' stop-color='%23e9c46a'/%3E%3Cstop offset='1' stop-color='%23b07b1e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M22 15h20c8.5 0 15.2 5.4 17.2 13l3.2 12c1.7 6.5-3 13-9.4 13-3.8 0-7-1.9-9-5l-3.6-5.5H23.6L20 48c-2 3.1-5.2 5-9 5-6.4 0-11.1-6.5-9.4-13l3.2-12C6.8 20.4 13.5 15 22 15z'/%3E%3C/svg%3E">
<title>Журнал игр</title>
</head>
<body>

<div class="topbar">
  <button class="gear" id="resultsBtn" aria-label="Итоги по годам">▦</button>
  <button class="gear" id="gearBtn" aria-label="Настройки синхронизации">⚙</button>
</div>
<header class="header">
  <span class="orn">◆</span>
  <h1>Журнал игр</h1>
  <span class="orn">◆</span>
</header>
<section class="stats">
  <div class="win stat playing"><b id="stPlaying">0</b><span>играю</span></div>
  <div class="win stat backlog"><b id="stBacklog">0</b><span>беклог</span></div>
  <div class="win stat done"><b id="stDone">0</b><span>пройдено</span></div>
</section>
<div class="fstatus" id="fstatus" hidden></div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-f="all" aria-label="Все игры — домашний экран"><svg class="homeicon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor" fill-rule="evenodd"><path d="M12 2.1c.4 0 .78.14 1.08.4l8.42 7.2c.9.77.35 2.3-.84 2.3H19v6.5A3.5 3.5 0 0 1 15.5 22h-7A3.5 3.5 0 0 1 5 18.5V12H3.34c-1.19 0-1.74-1.53-.84-2.3l8.42-7.2c.3-.26.68-.4 1.08-.4zM12 13.4a2.6 2.6 0 0 0-2.6 2.6V22h5.2v-6a2.6 2.6 0 0 0-2.6-2.6z"/></svg></button>
  <button class="tab" data-f="playing">Играю</button>
  <button class="tab" data-f="backlog">Беклог</button>
  <button class="tab" data-f="done">Пройдено</button>
  <button class="tab" data-f="dropped">Брошено</button>
  <button class="tab" data-f="onhold">Отложено</button>
  <button class="tab" data-f="catalog">Каталог</button>
  <button class="tab" data-f="fav">Избранное</button>
  <button class="tab nodatachip" id="nodataChip" hidden></button>
</nav>

<div class="bar mainbar">
  <div class="win search">
    <span class="scursor">▶</span>
    <input id="search" type="search" placeholder="Поиск" autocomplete="off">
    <button id="clearSearch" aria-label="Очистить" hidden>✕</button>
    <button class="addbtn" id="addBtn" aria-label="Добавить" title="Добавить"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 2h4v6h6v4h-6v6H8v-6H2V8h6V2z"/></svg></button>
  </div>
  <div class="ctl sortctl" id="sortCtl">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 4l4 5H9.5v11h-3V9H4l4-5z"/><path d="M16 20l-4-5h2.5V4h3v11H20l-4 5z"/></svg>
    <select id="sortSel" aria-label="Сортировка"></select>
  </div>
  <button class="ctl" id="viewBtn"></button>
</div>

<main id="list"></main>

<input type="file" id="csvFile" accept=".csv,text/csv">
<input type="file" id="jsonFile" accept=".json,application/json">
<div class="dicewin" id="diceWin" hidden>
  <div class="win dwin">
    <div class="rtop">
      <h2 class="rtitle dtitle" id="dTitle">Кубик судьбы</h2>
      <button class="rclose" id="diceClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="dform">
      <label class="dfield"><span id="dGenreLbl">Жанр</span><select id="dGenre"></select></label>
      <label class="dfield"><span id="dCsLbl">Оценка сообщества</span><select id="dCs"></select></label>
      <label class="dfield"><span id="dSeriesLbl">Серия</span><select id="dSeries"></select></label>
      <label class="dcheck"><input type="checkbox" id="dLib"><span id="dLibLbl">Есть в библиотеке</span></label>
      <label class="dcheck"><input type="checkbox" id="dFresh"><span id="dFreshLbl">Только нетронутые</span></label>
      <label class="dcheck"><input type="checkbox" id="dHold"><span id="dHoldLbl">Учитывать отложенные</span></label>
    </div>
    <div class="dpool" id="dPool"></div>
    <div class="drow">
      <button class="btn gold" id="diceRoll">🎲 Бросить</button>
      <button class="btn" id="diceQuick">Без фильтров</button>
    </div>
    <button class="btn dreset" id="diceReset">Сбросить фильтры</button>
  </div>
</div>

<div class="results" id="settingsWin" hidden>
  <div class="win rwin">
    <div class="rtop">
      <h2 class="rtitle" id="setTitle">Настройки</h2>
      <button class="rclose" id="setClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="sync setbody">
    <label class="setrow"><span class="setlabel" id="langLbl">Язык</span>
      <select id="langSel" aria-label="Language">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select></label>
    <label class="setrow"><span class="setlabel" id="themeLbl">Тема</span>
      <select id="themeSel" aria-label="Тема оформления">
        <option value="">Final Fantasy</option>
        <option value="genesis">Sega Genesis</option>
      </select></label>

    <div class="sprow">
      <button class="spoiler col" id="syncSpoiler" aria-expanded="false">
        <span class="caret">▾</span><span id="syncSpoilerLbl">Синхронизация</span>
      </button>
      <button class="infobtn" id="syncHelpBtn" aria-label="Что такое синхронизация">ⓘ</button>
    </div>
    <div class="synchelp" id="syncHelp" hidden>
      <p id="helpWhat"></p>
      <p id="helpGoogle"></p>
      <p id="helpGh"></p>
    </div>
    <div class="syncbody" id="syncBody" hidden>
      <input id="gsUrl" placeholder="Google Apps Script URL (…/exec)" autocomplete="off">
      <div class="hint" style="text-align:center" id="orGist">— или через GitHub Gist —</div>
      <input id="ghToken" type="password" placeholder="GitHub token" autocomplete="off">
      <input id="ghGist" placeholder="Gist ID" autocomplete="off">
      <div class="row2">
        <button class="btn gold" id="syncConnect">Подключить</button>
        <button class="btn" id="syncOff">Отключить</button>
      </div>
    </div>

    <div class="sethead" id="playniteHead">Playnite</div>
    <button class="btn" id="csvBtn">Импорт CSV</button>

    <div class="sethead" id="dataHead">Данные</div>
    <div class="row2">
      <button class="btn" id="bakBtn">Бэкап</button>
      <button class="btn" id="resBtn">Восстановить</button>
    </div>
    <div class="row2 bakrow">
      <select id="bakSel" aria-label="Автобэкапы"></select>
      <button class="btn" id="bakRestoreBtn">Откатиться</button>
    </div>
    <button class="btn" id="resetNoMergeBtn" hidden></button>
    </div>
  </div>
</div>

<div class="results" id="resultsWin" hidden>
  <div class="win rwin">
    <div class="rtop">
      <h2 class="rtitle" id="resTitle">Итоги</h2>
      <button class="rclose" id="resClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="rperiods" id="resPeriods"></div>
    <div class="rbody" id="resBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
